name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # para trusted publishing (OIDC)

jobs:
  publish-test:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # Nota: TestPyPI rechaza subir una versión ya publicada. Si falla con
      # "already exists", sube la versión en pyproject.toml antes de volver a
      # publicar.
      #
      # Publica por Trusted Publishing (OIDC): sin token de larga vida. El
      # trusted publisher (repo hvalles/encinorm, workflow
      # "publish-testpypi.yml") se registra en TestPyPI > Settings > Publishing.
      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always
