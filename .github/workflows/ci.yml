name: CI

on:
  push:
    branches: [main]
  pull_request:
  # CI-08: `release.yml` no puede usar `needs:` sobre un job de otro fichero, asi
  # que CI se expone como workflow reutilizable y `publish` lo llama.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: encino_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=admin --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: encino_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv fijado para que CI no resuelva una versión futura con distinto
          # comportamiento. El pin por SHA completo de las actions queda
          # diferido (ver .planning/phases/01-*/01-RESEARCH.md, T-01-04).
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra http --extra security --extra graphql

      - name: Run tests
        env:
          # Archivo de cobertura distinto por pata de la matriz: con
          # `parallel = true` cada job escribe el suyo y `coverage combine` los
          # une en el job `coverage` (D-06).
          COVERAGE_FILE: .coverage.py${{ matrix.python-version }}
          # CI-01: en CI un motor requerido ausente FALLA en vez de omitir
          # (D-01: exactamente los dos servicios que existen arriba). En local
          # la variable no existe y un motor ausente sigue omitiendo (D-03).
          ENCINO_ORM_REQUIRE_ENGINES: mysql,postgresql
          ENCINO_ORM_MYSQL_HOST: 127.0.0.1
          ENCINO_ORM_MYSQL_PORT: "3306"
          ENCINO_ORM_MYSQL_USER: root
          ENCINO_ORM_MYSQL_PASSWORD: admin
          ENCINO_ORM_MYSQL_DB: encino_orm_test
          ENCINO_ORM_POSTGRES_HOST: 127.0.0.1
          ENCINO_ORM_POSTGRES_PORT: "5432"
          ENCINO_ORM_POSTGRES_USER: postgres
          ENCINO_ORM_POSTGRES_PASSWORD: admin
          ENCINO_ORM_POSTGRES_DB: encino_orm_test
        # `-m "not optional_engine"` deselecciona los 13 tests de motores no
        # requeridos (D-02): los deseleccionados no aparecen en el XML, asi que
        # cualquier `skipped > 0` que quede es un skip NO marcado. `--junitxml`
        # alimenta el gate de abajo. `--cov-report=` desactiva el reporte por
        # pata: el combine y el gate de `fail_under` los aplica el job `coverage`.
        run: >
          uv run pytest -q -m "not optional_engine" --junitxml=junit.xml
          --cov=encino_orm --cov-branch --cov-report=

      - name: Gate — ningún test omitido
        # `if: always()` para que el gate reporte el conteo aunque pytest ya haya
        # fallado por otro motivo; sin esto un fallo de test ocultaria el skip.
        if: always()
        run: uv run python tools/ci/check_skips.py junit.xml

      - name: Subir datos de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage.py${{ matrix.python-version }}*
          # OBLIGATORIO: `.coverage.*` es un archivo oculto y
          # `upload-artifact` los excluye por defecto; sin esto el job de
          # combine no encuentra nada.
          include-hidden-files: true

  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check encino_orm tests

      - name: Ruff format --check
        run: uv run ruff format --check encino_orm tests

  typecheck:
    name: Tipos (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        # Mismos extras que el job `test`: el ratchet de mypy (CI-04) se midió
        # con fastapi/PyJWT/strawberry-graphql importables. Con `--group dev`
        # solo, `ignore_missing_imports` convierte esos paquetes en `Any` y el
        # gate mediría un conjunto de errores distinto al fijado (W3).
        run: uv sync --extra http --extra security --extra graphql

      - name: Mypy
        run: uv run mypy encino_orm

  deps:
    name: Dependencias y vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lockfile al dia
        # `uv lock --check` falla si `pyproject.toml` y `uv.lock` divergen, de
        # modo que un lock editado a mano o desactualizado no puede mergear.
        run: uv lock --check

      - name: Auditar dependencias (uv audit, feed OSV)
        # PyJWT 2.12.1: 5 avisos (9 entradas OSV), todos con fix en 2.13.0.
        # El proyecto mantiene el cap `PyJWT>=2.8,<2.13` (CONCERNS.md), que
        # bloquea esas correcciones. Se aceptan de forma TEMPORAL: ampliar el
        # cap es un cambio de dependencia que puede romper la capa `security`
        # y queda fuera del alcance de 01-02 (fase de red de seguridad, cero
        # cambio de comportamiento). Se levantaran al revalidar la capa de
        # seguridad y ampliar el cap en la Fase 6 (CFG-02).
        # La lista de ignores es explicita y revisable; el gate es bloqueante.
        run: |
          uv audit \
            --ignore GHSA-993g-76c3-p5m4 \
            --ignore GHSA-fhv5-28vv-h8m8 \
            --ignore GHSA-jq35-7prp-9v3f \
            --ignore GHSA-w7vc-732c-9m39 \
            --ignore GHSA-xgmm-8j9v-c9wx

      - name: Cross-check (pip-audit sobre uv export, feed PyPA)
        # pip-audit no lee uv.lock (verificado: `--locked .` -> "no lockfiles
        # found"), asi que se le alimenta el export de uv. Usa el feed PyPA,
        # distinto del feed OSV de `uv audit`: dos fuentes independientes.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes > "$RUNNER_TEMP/uv-export.txt"
          uv run pip-audit -r "$RUNNER_TEMP/uv-export.txt"

  coverage:
    name: Cobertura combinada (ratchet)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Descargar datos de cobertura de cada pata
        uses: actions/download-artifact@v4
        with:
          # `merge-multiple` deja los `.coverage.py*` en un solo directorio para
          # que `coverage combine` los encuentre.
          pattern: coverage-py*
          merge-multiple: true

      - name: Combinar cobertura de la matriz
        run: uv run coverage combine

      - name: Gate de cobertura (fail_under desde pyproject.toml)
        # `fail_under = 82` vive en [tool.coverage.report]; este step es el que
        # convierte el ratchet no-baja en un gate bloqueante.
        run: uv run coverage report
