name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: encinorm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=admin --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: encinorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra http --extra security --extra graphql

      - name: Run tests
        env:
          ENCINORM_MYSQL_HOST: 127.0.0.1
          ENCINORM_MYSQL_PORT: "3306"
          ENCINORM_MYSQL_USER: root
          ENCINORM_MYSQL_PASSWORD: admin
          ENCINORM_MYSQL_DB: encinorm_test
          ENCINORM_POSTGRES_HOST: 127.0.0.1
          ENCINORM_POSTGRES_PORT: "5432"
          ENCINORM_POSTGRES_USER: postgres
          ENCINORM_POSTGRES_PASSWORD: admin
          ENCINORM_POSTGRES_DB: encinorm_test
        run: uv run pytest -q
