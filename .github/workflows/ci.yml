name: CI

on:
  push:
    branches: [main]
  pull_request:
  # CI-08: `release.yml` no puede usar `needs:` sobre un job de otro fichero, asi
  # que CI se expone como workflow reutilizable y `publish` lo llama.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: encino_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=admin --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: encino_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      # DIAL-08: MariaDB promovido a motor REQUERIDO (deja de ser opcional).
      # MySQL ya ocupa el 3306, y el default del test es 3307 (test_mariadb.py:12).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: admin
          MARIADB_DATABASE: encino_orm_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root --password=admin --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      # DIAL-08: Redis promovido a motor REQUERIDO (backend de CachedModel).
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # uv fijado para que CI no resuelva una versión futura con distinto
          # comportamiento. El pin por SHA completo de las actions queda
          # diferido (ver .planning/phases/01-*/01-RESEARCH.md, T-01-04).
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # `--extra cache` aporta el driver `redis`, sin el cual los tests de
        # CachedModel fallan con ImportError en vez de ejercitar el backend.
        run: uv sync --extra http --extra security --extra graphql --extra cache

      - name: Run tests
        env:
          # Archivo de cobertura distinto por pata de la matriz: con
          # `parallel = true` cada job escribe el suyo y `coverage combine` los
          # une en el job `coverage` (D-06).
          COVERAGE_FILE: .coverage.py${{ matrix.python-version }}
          # CI-01: en CI un motor requerido ausente FALLA en vez de omitir.
          # D-02/DIAL-08: MariaDB y Redis se promovieron a requeridos; MSSQL y
          # Oracle siguen fuera de esta lista porque su job es `engine-heavy`.
          ENCINO_ORM_REQUIRE_ENGINES: mysql,postgresql,mariadb,redis
          ENCINO_ORM_MYSQL_HOST: 127.0.0.1
          ENCINO_ORM_MYSQL_PORT: "3306"
          ENCINO_ORM_MYSQL_USER: root
          ENCINO_ORM_MYSQL_PASSWORD: admin
          ENCINO_ORM_MYSQL_DB: encino_orm_test
          ENCINO_ORM_POSTGRES_HOST: 127.0.0.1
          ENCINO_ORM_POSTGRES_PORT: "5432"
          ENCINO_ORM_POSTGRES_USER: postgres
          ENCINO_ORM_POSTGRES_PASSWORD: admin
          ENCINO_ORM_POSTGRES_DB: encino_orm_test
          ENCINO_ORM_MARIADB_HOST: 127.0.0.1
          ENCINO_ORM_MARIADB_PORT: "3307"
          ENCINO_ORM_MARIADB_USER: root
          ENCINO_ORM_MARIADB_PASSWORD: admin
          ENCINO_ORM_MARIADB_DB: encino_orm_test
          ENCINO_ORM_REDIS_URL: redis://127.0.0.1:6379
        # `-m "not optional_engine"` deselecciona SOLO los tests de MSSQL y
        # Oracle (D-02), cuyo job es `engine-heavy`. Los deseleccionados no
        # aparecen en el XML, asi que cualquier `skipped > 0` que quede es un
        # skip NO marcado. `--junitxml` alimenta el gate de abajo.
        # `--cov-report=` desactiva el reporte por pata: el combine y el gate de
        # `fail_under` los aplica el job `coverage`.
        # POOL-07: `--timeout-method=signal` (Linux) permite que la corrida
        # CONTINÚE tras un timeout; el método *thread* (default en Windows)
        # mata el proceso y pierde el JUnit XML (Pitfall 7).
        run: >
          uv run pytest -q -m "not optional_engine" --timeout-method=signal
          --junitxml=junit.xml --cov=encino_orm --cov-branch --cov-report=

      - name: Gate — ningún test omitido
        # `if: always()` para que el gate reporte el conteo aunque pytest ya haya
        # fallado por otro motivo; sin esto un fallo de test ocultaria el skip.
        if: always()
        run: uv run python tools/ci/check_skips.py junit.xml

      - name: Subir datos de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage.py${{ matrix.python-version }}*
          # OBLIGATORIO: `.coverage.*` es un archivo oculto y
          # `upload-artifact` los excluye por defecto; sin esto el job de
          # combine no encuentra nada.
          include-hidden-files: true

  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check encino_orm tests

      - name: Ruff format --check
        run: uv run ruff format --check encino_orm tests

  typecheck:
    name: Tipos (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        # Mismos extras que el job `test`: el ratchet de mypy (CI-04) se midió
        # con fastapi/PyJWT/strawberry-graphql importables. Con `--group dev`
        # solo, `ignore_missing_imports` convierte esos paquetes en `Any` y el
        # gate mediría un conjunto de errores distinto al fijado (W3).
        run: uv sync --extra http --extra security --extra graphql

      - name: Mypy
        run: uv run mypy encino_orm

  deps:
    name: Dependencias y vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lockfile al dia
        # `uv lock --check` falla si `pyproject.toml` y `uv.lock` divergen, de
        # modo que un lock editado a mano o desactualizado no puede mergear.
        run: uv lock --check

      - name: Auditar dependencias (uv audit, feed OSV)
        # PyJWT 2.12.1: 5 avisos (9 entradas OSV), todos con fix en 2.13.0.
        # El proyecto mantiene el cap `PyJWT>=2.8,<2.13` (CONCERNS.md), que
        # bloquea esas correcciones. Se aceptan de forma TEMPORAL: ampliar el
        # cap es un cambio de dependencia que puede romper la capa `security`
        # y queda fuera del alcance de 01-02 (fase de red de seguridad, cero
        # cambio de comportamiento). Se levantaran al revalidar la capa de
        # seguridad y ampliar el cap en la Fase 6 (CFG-02).
        # La lista de ignores es explicita y revisable; el gate es bloqueante.
        run: |
          uv audit \
            --ignore GHSA-993g-76c3-p5m4 \
            --ignore GHSA-fhv5-28vv-h8m8 \
            --ignore GHSA-jq35-7prp-9v3f \
            --ignore GHSA-w7vc-732c-9m39 \
            --ignore GHSA-xgmm-8j9v-c9wx

      - name: Cross-check (pip-audit sobre uv export, feed PyPA)
        # pip-audit no lee uv.lock (verificado: `--locked .` -> "no lockfiles
        # found"), asi que se le alimenta el export de uv. Usa el feed PyPA,
        # distinto del feed OSV de `uv audit`: dos fuentes independientes.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes > "$RUNNER_TEMP/uv-export.txt"
          uv run pip-audit -r "$RUNNER_TEMP/uv-export.txt"

  engine-heavy:
    name: Motores pesados (MSSQL + Oracle)
    runs-on: ubuntu-latest
    # Oracle tarda 60-120 s en arrancar. UNA sola pata (3.12): el comportamiento
    # de dialecto no depende del interprete, y multiplicar Oracle por 4 legs no
    # anade cobertura. Este job NUNCA es advisory: un job que no puede fallar es
    # CI verde sin verificacion (T-02-26).
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Admin_123
        ports:
          - 1433:1433
        # `sqlcmd` vive en /opt/mssql-tools18/bin en la imagen 2022 y necesita
        # `-C` para confiar en el certificado autofirmado. Si esa ruta cambiara
        # en una imagen futura, degradar a una comprobacion de puerto TCP.
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Admin_123 -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      oracle:
        image: gvenzl/oracle-free
        env:
          ORACLE_PASSWORD: admin
        ports:
          - 1521:1521
        # `gvenzl/oracle-free` trae su propio HEALTHCHECK; no se sobreescribe.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true

      - name: Instalar ODBC Driver 18 (SQL Server)
        # PRERREQUISITO DURO: el runner ubuntu-24.04 NO trae unixodbc ni
        # msodbcsql18, asi que pyodbc/aioodbc no pueden abrir conexion. Sin este
        # paso el job falla en el import, no en una asercion. Clave y repo
        # OFICIALES de packages.microsoft.com sobre HTTPS (T-02-31).
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        # Sin los extras los drivers son inimportables y los fixtures convierten
        # el ImportError en un fallo confuso.
        run: uv sync --extra mssql --extra oracle

      - name: Run tests (MSSQL + Oracle)
        env:
          COVERAGE_FILE: .coverage.heavy
          # DIAL-08: ambos motores son REQUERIDOS en este job. Un motor ausente
          # FALLA (`engine_unavailable`), no se omite.
          ENCINO_ORM_REQUIRE_ENGINES: mssql,oracle
          ENCINO_ORM_MSSQL_HOST: 127.0.0.1
          ENCINO_ORM_MSSQL_PORT: "1433"
          ENCINO_ORM_MSSQL_USER: sa
          ENCINO_ORM_MSSQL_PASSWORD: Admin_123
          ENCINO_ORM_MSSQL_DB: encino_orm_test
          ENCINO_ORM_MSSQL_DRIVER: ODBC Driver 18 for SQL Server
          ENCINO_ORM_MSSQL_TRUST_CERT: "true"
          ENCINO_ORM_ORACLE_HOST: 127.0.0.1
          ENCINO_ORM_ORACLE_PORT: "1521"
          # DESAJUSTE DE SERVICE NAME: `gvenzl/oracle-free` usa FREEPDB1, mientras
          # que `docker-compose.yml` (gvenzl/oracle-xe) usa XEPDB1. Sin este
          # override los tests de Oracle no conectan.
          ENCINO_ORM_ORACLE_SERVICE: FREEPDB1
          ENCINO_ORM_ORACLE_USER: system
          ENCINO_ORM_ORACLE_PASSWORD: admin
        # Seleccion por FICHERO, NO por marker: los dos ficheros conservan
        # `optional_engine` para que el job `test` los deseleccione, asi que
        # filtrar por marker aqui dejaria el job probando CERO tests (el fallo
        # silencioso que esta fase elimina).
        #
        # PROCEDENCIA (sonda pendiente): los techos ad-hoc de parametros de
        # MSSQL (2100) y Oracle (65535) de `dialects/strategies.py::LIMITS` NO
        # estan verificados empiricamente. La sonda manual descrita en
        # 02-VALIDATION.md §Manual-Only Verifications debe correrse en ESTE job y
        # anotar el valor medido junto a las constantes. NO convertir la sonda en
        # un gate advisory.
        #
        # `--cov-fail-under=0`: esta pata corre SOLO dos ficheros, asi que su
        # cobertura parcial (35%) no puede compararse con el piso global de 82
        # (`[tool.coverage.report]`). El piso real lo aplica el job `coverage`
        # sobre la union combinada de todas las patas; sin este override el job
        # falla SIEMPRE por cobertura aunque los 46 tests pasen.
        # POOL-07: mismo razonamiento que el job `test`: método *signal* en
        # Linux para que un timeout no mate el proceso ni pierda el XML.
        run: >
          uv run pytest -q tests/test_mssql.py tests/test_oracle.py
          --timeout-method=signal --junitxml=junit.xml --cov=encino_orm
          --cov-branch --cov-report= --cov-fail-under=0

      - name: Gate — ningún test omitido
        if: always()
        run: uv run python tools/ci/check_skips.py junit.xml

      - name: Subir datos de cobertura de los motores pesados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-heavy
          path: .coverage.heavy*
          include-hidden-files: true

  coverage:
    name: Cobertura combinada (ratchet)
    needs: [test, engine-heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin por versión de uv; el pin por SHA de la action queda diferido.
          version: "0.12.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Descargar datos de cobertura de cada pata
        uses: actions/download-artifact@v4
        with:
          # `merge-multiple` deja los `.coverage.*` en un solo directorio para
          # que `coverage combine` los encuentre. El patron `coverage-*` incluye
          # tanto las patas de la matriz como `coverage-heavy`, de modo que la
          # cobertura de MSSQL/Oracle entra en el total combinado.
          pattern: coverage-*
          merge-multiple: true

      - name: Combinar cobertura de la matriz
        run: uv run coverage combine

      - name: Gate de cobertura (fail_under desde pyproject.toml)
        # `fail_under = 82` vive en [tool.coverage.report]; este step es el que
        # convierte el ratchet no-baja en un gate bloqueante.
        run: uv run coverage report

      - name: Gate de pisos de cobertura POR MODULO (D-04/D-06 de Fase 1)
        # El piso global (`fail_under = 82`) sigue vigente por separado arriba.
        # Este gate anade pisos por modulo sobre `coverage json`, que es la unica
        # forma de expresar "95% aqui, 100% alla" en una sola corrida: coverage.py
        # NO soporta `fail_under` por fichero. El script falla cerrado si un
        # modulo del mapa desaparece del reporte.
        run: |
          uv run coverage json -o coverage.json
          uv run python tools/ci/check_coverage_floors.py coverage.json
