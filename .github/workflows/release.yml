name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # para trusted publishing (OIDC)

jobs:
  # CI-08: `needs:` no puede cruzar ficheros de workflow, asi que se llama a
  # `ci.yml` como workflow reutilizable. Con `./` el workflow llamado es el del
  # MISMO commit que el caller, que es la semantica correcta sobre un tag.
  ci:
    name: CI (reusable)
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    name: Build and publish
    runs-on: ubuntu-latest
    # D-02: el entorno `pypi` es la unica via de publicacion. Sus protecciones
    # (deployment branch `main`, required status checks sobre los jobs de
    # `ci.yml` y aprobacion de revisores) se configuran en GitHub > Settings >
    # Environments, NO en este YAML.
    environment:
      name: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pin de uv en la ruta de publicacion (T-01-04): el entorno que
          # publica un artefacto debe usar una version conocida.
          version: "0.12.15"
          enable-cache: true

      - name: Build
        run: uv build

      # Publica a PyPI por Trusted Publishing (OIDC): sin token de larga vida
      # que reutilizar fuera del workflow. El trusted publisher (repo
      # hvalles/encinorm, workflow "release.yml", environment "pypi") se
      # registra en PyPI > Settings > Publishing.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      # Nota: la validacion previa contra TestPyPI la ejecuta el workflow manual
      # "Publish to TestPyPI" (publish-testpypi.yml), tambien por OIDC.
