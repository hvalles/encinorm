[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encino_orm"]

[project]
name = "encino-orm"
version = "0.2.5"
description = "Librería asíncrona de interfaz unificada para SQLite, MySQL y PostgreSQL"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Hector", email = "valles.hector@gmail.com" },
]
dependencies = [
    "aiomysql>=0.2,<0.3.2",
    "aiosqlite",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
security = ["fastapi>=0.110", "PyJWT>=2.8,<2.13"]
http = ["fastapi>=0.110"]
graphql = ["strawberry-graphql>=0.200"]
cache = ["redis>=5.0"]
mssql = ["aioodbc>=0.5", "pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
all-db = ["aioodbc>=0.5", "pyodbc>=5.0", "oracledb>=2.0"]

[project.urls]
Repository = "https://github.com/hvalles/encinorm"
Documentation = "https://hvalles.github.io/encinorm/"

[project.scripts]
encino_orm = "encino_orm.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
