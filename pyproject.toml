[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encino_orm"]

[project]
name = "encino-orm"
version = "0.2.6"
description = "Librería asíncrona de interfaz unificada para SQLite, MySQL y PostgreSQL"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Hector", email = "valles.hector@gmail.com" },
]
dependencies = [
    "aiomysql>=0.2,<0.3.2",
    "aiosqlite",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
security = ["fastapi>=0.110", "PyJWT>=2.8,<2.13"]
http = ["fastapi>=0.110"]
graphql = ["strawberry-graphql>=0.200"]
cache = ["redis>=5.0"]
mssql = ["aioodbc>=0.5", "pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
all-db = ["aioodbc>=0.5", "pyodbc>=5.0", "oracledb>=2.0"]

[project.urls]
Repository = "https://github.com/hvalles/encinorm"
Documentation = "https://hvalles.github.io/encinorm/"

[project.scripts]
encino_orm = "encino_orm.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.4 exige ambos loop scopes explícitos. Con un loop de sesión,
# un pool filtrado o el singleton de `set_default_db` sobrevivirían entre tests
# y producirían fallos dependientes del orden (Pitfall 15).
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# -ra: resumen de motivos al final. --strict-markers: un marker no registrado
# falla la colección en vez de quedar inerte (CI-06).
addopts = "-ra --strict-markers"
# Hoy no hay ningún xfail; activarlo es gratis y evita que un xfail pase en
# silencio si su expectativa deja de cumplirse.
xfail_strict = true
# D-07: cualquier warning nuevo FALLA la suite. La allowlist arranca vacía
# porque la suite se verificó sin warnings bajo `-W error`. Solo se puede
# añadir una entrada con justificación escrita que nombre el módulo y el
# motivo (p. ej. "ignore::DeprecationWarning:<modulo>" si una pata de la
# matriz 3.12/3.13 falla por una deprecación específica de versión); nunca se
# debilita el "error" global.
filterwarnings = [
    "error",
    # Python 3.12 deprecó el adaptador datetime implicito de sqlite3. aiosqlite
    # pasa objetos datetime sin registrar adaptador, asi que el aviso aparece en
    # cada INSERT con fecha y, bajo "error", tumba la suite en las patas 3.12 y
    # 3.13 (verificado en el run 35290398072). Se silencia UNICAMENTE ese aviso;
    # cualquier otro warning sigue siendo error.
    # Fix definitivo: registrar un adaptador datetime explicito en el adaptador
    # SQLite (cambia el formato de almacenamiento) -> Fase 2 (DIAL) o Fase 7.
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]
# D-08: los cuatro markers registrados para que `--strict-markers` no falle y
# para que el comando del README (`-m "not integration"`) sea real.
markers = [
    "integration: requiere un motor real (MySQL/PostgreSQL en CI; opcionales en local)",
    "optional_engine: motor no requerido en Fase 1 (MariaDB/Redis/MSSQL/Oracle); ver D-02",
    "concurrency: tests de pool/carreras; se excluyen de corridas con xdist",
    "benchmark: medidos por pytest-codspeed; excluidos de corridas normales",
    # POOL-07: variante de estrés (pytest-repeat). El marker queda inerte hasta
    # que 04-06 lo use; registrarlo evita que `--strict-markers` falle la
    # colección al aplicar `@pytest.mark.stress`.
    "stress: variante de estrés con pytest-repeat; se corre con --count=N",
]
# POOL-07: timeout global DESACTIVADO a propósito. El job `engine-heavy`
# (Oracle tarda 60-120 s en arrancar) no debe morir por un límite global; el
# timeout se aplica por marker SOLO a los tests de barrera
# (`@pytest.mark.timeout(10-20)`), donde un `parties` mal ajustado colgaría la
# suite para siempre. El método *signal* de CI permite continuar tras el corte.
timeout = 0

[tool.coverage.run]
source_pkgs = ["encino_orm"]
# La cobertura de ramas importa: la mayoria de los fallos de dialecto son
# ramas no tomadas, no lineas no ejecutadas.
branch = true
# REQUIRED: cada pata de la matriz escribe su propio archivo de datos
# (`.coverage.py<version>`; coverage puede añadir ademas el sufijo paralelo
# `<host>.<pid>.<rand>`). Sin `parallel` las patas se sobrescribirian entre si
# y `coverage combine` solo veria la ultima.
parallel = true

[tool.coverage.report]
precision = 1
show_missing = true
# RATCHET no-baja (D-05). Medido el 2026-09-17 con coverage 7.16.1 y cobertura
# de ramas: **83%** en el escenario equivalente a CI (solo MySQL + PostgreSQL,
# 475 tests) y **88%** en local con los seis motores en Docker.
# El piso se fija contra el 83%, NO contra el 88%: en CI solo corren MySQL y
# PostgreSQL, y `oracle.py` cae del 59% al 16% cuando se excluyen los tests de
# motores opcionales. Un piso de 88 fallaria en la primera corrida de CI
# (Pitfall 2b). Fase 2 sube el piso y añade pisos por dialecto sobre el seam
# `dialects/` (D-04/D-06); aqui solo se monta el mecanismo.
fail_under = 82
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# Debe coincidir con requires-python: dirige las reescrituras de las reglas UP.
target-version = "py310"
# A 88 el baseline pre-formato era de 195 hallazgos en encino_orm/ frente a 128 a 100,
# y la salida de `ruff format` depende de este valor. 100 es la fuente de verdad
# (ver AGENTS.md §Code Style, actualizado en Fase 1).
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "FURB", "ASYNC", "RUF", "S", "PT",
]
# No se habilitan en este milestone: "ANN", "D", "PL". Racional: 101 ficheros /
# 507 tests; habilitarlos en bloque produce un diff irrevisable y entierra los
# hallazgos reales.

[tool.ruff.lint.per-file-ignores]
# D-09: no se reescriben asserts genéricos (pytest.raises(Exception)) ni asserts
# de estado privado en Fase 1, así que PT011/B017 se ignoran aquí y se levantan
# en Fase 4. PT012/PT018/PT006 siguen activos.
"tests/**" = ["S101", "PT011", "B017", "ARG001", "ARG002"]
# S608: los constructores de dialecto interpolan SQL intencionadamente.
# La validación centralizada llega en Fase 2 (DIAL-02); el resto de `S` sigue activo.
# S608: el builder DML centralizado interpola identificadores a proposito; la
# frontera de confianza esta documentada en el modulo y la defensa es
# check_identifier aplicado antes de construir cualquier SQL (DIAL-02).
"encino_orm/dialects/builders.py" = ["S608"]
"encino_orm/sqlite.py" = ["S608"]
"encino_orm/mysql.py" = ["S608"]
"encino_orm/mariadb.py" = ["S608"]
"encino_orm/postgresql.py" = ["S608"]
"encino_orm/mssql.py" = ["S608"]
"encino_orm/oracle.py" = ["S608"]
"encino_orm/transfer.py" = ["S608"]
"encino_orm/model/model.py" = ["S608"]
# S608: el runner del ledger interpola el nombre de tabla (constante de modulo
# validada con check_identifier antes de construir el SQL); `name`/`status`
# viajan SIEMPRE como parametros ligados (T-03-01-01/T-03-01-02).
"encino_orm/migration.py" = ["S608"]
# S102: handlers generados con exec(); se sustituyen en Fase 6 (CFG-03).
# B008: Depends(...) en defaults de inyección de dependencias de FastAPI; se
# levanta en Fase 6 (CFG-02).
"encino_orm/http/routes.py" = ["S102", "B008"]
"encino_orm/graphql/schema.py" = ["S102"]
# B008: Depends(...)/require(...) en defaults de FastAPI (5 hallazgos); idiom del
# framework, se levanta en Fase 6 (CFG-02).
"encino_orm/security/guard.py" = ["B008"]
# S608: igual que el resto de adaptadores. S311: `random` solo alimenta el
# backoff con jitter para reintentos de deadlock; no es sensible a seguridad.
# PERF203: el try/except debe permanecer dentro del bucle de reintentos (máx. 9
# iteraciones) para el control de flujo; sacarlo cambia la semántica.
"encino_orm/base.py" = ["S608", "S311", "PERF203"]
# PERF203: `get_nowait()` + `except QueueEmpty` es la condición del bucle de
# adquisición; no se puede sacar el try/except sin cambiar la semántica.
"encino_orm/pool.py" = ["PERF203"]
# S324: sha1 construye claves de caché, no una frontera de seguridad.
"encino_orm/model/cached.py" = ["S324"]
"encino_orm/model/filter.py" = ["S324"]
# B008: Depends/require en defaults (2 hallazgos). S105: la constante SECRET es
# solo de test. Ambos se levantan en Fase 6 (CFG-02).
"tests/test_security.py" = ["B008", "S105"]
# Interpola SQL a propósito para ejercitar los fragmentos portables.
"tests/test_sql_functions.py" = ["S608"]
# S608: los tests del ledger interpolan la constante MIGRATIONS_TABLE (fuente
# unica) para crear/leer el ledger legacy; no hay entrada no confiable.
"tests/test_migrations.py" = ["S608"]
# S603: los guards de tests/test_pytest_config.py lanzan pytest en un
# subproceso con `sys.executable` y argumentos construidos por el propio test
# (rutas de `tmp_path`); no hay entrada no confiable. La regla exige un comando
# completamente literal, imposible con una ruta dinamica. Se levantara si
# aparece una alternativa sin subprocess (p. ej. el fixture `pytester`).
"tests/test_pytest_config.py" = ["S603"]
# S314: el gate de skips parsea un artefacto de build producido por el propio
# job (no hay entrada no confiable) y `xml.etree.ElementTree` de CPython no
# resuelve entidades externas por defecto (T-01-11). La alternativa
# (`defusedxml`) violaria la regla "solo stdlib" de `tools/ci/`. Se levantara
# solo si el XML pasara a venir de fuera del job.
"tools/ci/check_skips.py" = ["S314"]

[tool.ruff.lint.isort]
known-first-party = ["encino_orm"]

[tool.mypy]
# No estricto (CI-04): se aterriza en el suelo de la escalera medida en
# 01-RESEARCH.md §Code Examples ("Mypy configuration"), no en el bloque de
# .planning/research/STACK.md (que rinde 458 errores y NO es non-strict).
python_version = "3.10"
files = ["encino_orm"]
# Las capas opcionales (fastapi, PyJWT, strawberry-graphql) y los drivers
# opcionales no declaran tipos completos; sin esto el ruido de imports
# ahogaría el gate. El CI sincroniza los mismos extras que el job `test`
# para que este ajuste no convierta esos módulos en `Any` (W3).
ignore_missing_imports = true
# El plugin de pydantic aporta los tipos sintetizados de `Model`/`Records`;
# sin él mypy ve `Any` en la superficie de los modelos.
plugins = ["pydantic.mypy"]
# Anti-podredumbre: cualquier `# type: ignore` que deje de ser necesario falla
# el gate. Es el control que impide que las supresiones derroten el chequeo.
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# RATCHET de tipos (CI-04). Medido el 2026-09-17 con mypy 2.3.1 sobre este
# repositorio, con `--python-version 3.10` y los extras opcionales instalados
# (`uv sync --extra http --extra security --extra graphql`).
#
# Baseline: 64 errores en 17 de 56 ficheros. Los módulos de abajo quedan
# excluidos con `ignore_errors = true` (NO con `# type: ignore`: el conteo de
# supresiones inline en `encino_orm/` es 0 y debe seguir siéndolo).
#
# REGLA: las entradas se QUITAN a medida que el módulo se limpia. NUNCA se
# añade una entrada nueva sin justificación escrita aquí. El objetivo es que
# este bloque encoja hasta desaparecer.
#
# Nota de entorno (W3): los conteos se tomaron con fastapi/PyJWT/
# strawberry-graphql importables. El job `typecheck` de CI sincroniza los
# mismos extras que el job `test`; sin ellos `ignore_missing_imports` convierte
# esos paquetes en `Any` y el gate mediría un conjunto de errores distinto.
# ---------------------------------------------------------------------------

[[tool.mypy.overrides]]
# Concentración principal medida (52 de los 64 errores).
module = [
    "encino_orm.model.model",          # 20 errores — se limpia en Fase 2 (DIAL) y Fase 4 (POOL-03)
    "encino_orm.model.query_builder",  #  9 errores — se limpia en Fase 2 (DIAL-03: count/paginate/list_tables)
    "encino_orm.model.cached",         #  6 errores — se limpia en Fase 3 (DATA-03: invalidación de escritura)
    "encino_orm.pool",                 #  5 errores — se limpia en Fase 4 (POOL-01…06)
    "encino_orm.security.models",      #  4 errores — se limpia en Fase 6 (CFG-02: SecurityConfig inmutable)
]
ignore_errors = true

[[tool.mypy.overrides]]
# 6 errores (filters 3, resolvers 2, types 1). Los cinco `name-defined`
# (`Name "child.__name__" is not defined`) son un artefacto del patrón de
# handlers generados con `exec()`, que CFG-03 (Fase 6) elimina; CFG-04
# (Fase 6) elimina además la mutación del namespace de GraphQL.
module = ["encino_orm.graphql.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Cola medida: 6 errores repartidos en módulos pequeños. Se limpian cuando la
# fase que reescribe cada módulo pase por él.
module = [
    "encino_orm.migration",            # 3 errores — Fase 3 (DATA-01/DATA-02: ledger y migrate atómico)
    "encino_orm.http.routes",          # 2 errores — Fase 6 (CFG-03: exec() → closures)
    "encino_orm.http.parsing",         # 2 errores — Fase 6 (CFG-03: capa HTTP)
    "encino_orm.oracle",               # 2 errores — Fase 2 (DIAL-01/DIAL-02) y Fase 5 (RESL-01)
    "encino_orm.mysql",                # 1 error  — Fase 2 (DIAL-01/DIAL-02) y Fase 5 (RESL-01)
    "encino_orm.mssql",                # 1 error  — Fase 2 (DIAL-01/DIAL-02) y Fase 5 (RESL-01)
    "encino_orm.model.references",     # 1 error  — Fase 2 (DIAL-02: validación en los builders)
    "encino_orm.security.guard",       # 1 error  — Fase 6 (CFG-02: factorías de guardas)
    "encino_orm.base",                 # 1 error  — Fase 5 (RESL-02: plantilla `_with_reconnect`)
]
ignore_errors = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # Pin exacto: la salida del formateador de ruff está versionada; sin fijar,
    # CI podría resolver una versión más nueva cuyo formato difiere y provocar
    # un `ruff format --check` fallido en un PR no relacionado.
    "ruff==0.16.8",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.16.1",
    "pip-audit>=2.10.1",
    # Pin exacto: el FORMATO DE SERIALIZACION de los snapshots `.ambr` está
    # versionado igual que la salida de ruff. Sin fijar, CI podría resolver una
    # versión más nueva que reformatee los `.ambr` y romper la suite en un PR no
    # relacionado. Actualizar el pin es un cambio deliberado + `--snapshot-update`.
    "syrupy==6.1.1",
    # Pin exacto: el plugin mata tests de barrera colgados; una versión más
    # nueva podría cambiar el comportamiento del método *signal* o su
    # compatibilidad con pytest y romper la corrida en un PR no relacionado.
    # Actualizar el pin es un cambio deliberado y revisable (Pitfall 7).
    "pytest-timeout==2.4.0",
    # Pin exacto: el conteo de repeticiones de la variante de estrés está
    # versionado; sin fijar, CI/local podría resolver una versión más nueva
    # con distinto comportamiento de `--count` y romper un PR no relacionado.
    "pytest-repeat==0.9.4",
]
